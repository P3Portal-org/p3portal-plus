name: Bug report
description: Report a problem that is NOT a security vulnerability.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠ **Security issues should NOT be reported here.** Use the
        [Security report](https://github.com/P3Portal-org/p3portal-plus/issues/new?template=security_report.yml)
        template instead — see [`SECURITY.md`](https://github.com/P3Portal-org/p3portal-plus/blob/main/SECURITY.md).

  - type: markdown
    attributes:
      value: |
        ## ⚠ Do NOT paste any source code in this issue

        This repository is licensed under LICENSE-PLUS. Pasting source
        code — your own snippets, suggested patches, exploit code, or
        diffs against the Plus source — creates a contribution-licensing
        ambiguity and is not accepted.

        Describe the bug, the reproducer, and any root-cause analysis in
        prose only.

        What IS welcome and licence-safe:
        - Behaviour descriptions (what happened vs what you expected)
        - Reproducer commands, request payloads, file contents (not Plus source)
        - Affected file paths, function names, line numbers
        - A prose description of the root cause, if identified
        - Suggested mitigations described in words

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened? What did you expect to happen?
      placeholder: |
        Describe the bug in prose. Include what you tried, what
        happened instead, and (if you know) why.
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: Smallest possible steps that reliably trigger the bug.
      placeholder: |
        1. ...
        2. ...
        3. Bug appears
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plus image tag
      description: The Plus image tag you pulled (e.g. ghcr.io/p3portal-org/p3portal-plus:v1.75.1-beta).
      placeholder: "ghcr.io/p3portal-org/p3portal-plus:v1.75.1-beta"
    validations:
      required: true

  - type: input
    id: host_os
    attributes:
      label: Host OS
      description: Distribution and version.
      placeholder: "Debian 12.5"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Container runtime + version
      description: Podman or Docker, with version. Compose tool + version if used.
      placeholder: "podman 5.0.3, podman-compose 1.2"
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: Root cause (optional, prose only)
      description: |
        If you've identified the root cause, describe it in prose.
        Reference affected files / functions / lines.
        Do NOT paste any source code.
      placeholder: |
        Example: "In `backend/plus/foo.py` the function `bar()` assumes
        X but does not validate Y, so when Z happens it crashes."

  - type: textarea
    id: mitigation
    attributes:
      label: Suggested mitigation (optional, prose only)
      description: |
        If you have an idea how to fix it, describe the approach in
        prose. Do NOT include source code or patches.
      placeholder: |
        Example: "Validate Y before proceeding; if invalid, return a
        400 with a clear error message."
